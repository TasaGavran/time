<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover"
    />
    <title>Naš meni | Time Caffe</title>
    <meta
      name="description"
      content="Istražite kompletan meni Time Caffe-a u Jagodini – kafa, espresso pića, čajevi, kokteli, osvežavajuća pića i deserti."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              espresso: "#2B211C",
              coffee: "#4B3425",
              latte: "#D9C3A3",
              cream: "#F5EEE6",
              gold: "#C9A36A",
            },
            fontFamily: {
              display: ["Poppins", "system-ui", "sans-serif"],
              body: ["DM Sans", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=25" />
  </head>
  <body
    class="bg-cream text-espresso font-body antialiased transition-colors duration-500 ease-out min-w-0 w-full dark:bg-espresso dark:text-cream"
  >
    <div
      id="page-transition"
      class="pointer-events-none fixed inset-0 z-40 bg-espresso opacity-0"
    ></div>
    <script>function hideOverlay(){var o=document.getElementById("page-transition");if(o)o.style.opacity="0";}hideOverlay();document.addEventListener("pageshow",hideOverlay);document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")hideOverlay();});document.addEventListener("DOMContentLoaded",hideOverlay);</script>

    <header
      class="sticky top-0 z-20 border-b border-espresso/10 bg-espresso/95 backdrop-blur dark:border-black/40"
    >
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 md:px-6"
      >
        <a href="/" class="flex items-center gap-3">
          <span
            class="font-display text-sm font-semibold tracking-wide text-cream"
            >Time Caffe</span
          >
        </a>
        <div class="flex items-center gap-3">
          <button
            id="theme-toggle"
            class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-white/5 text-gold shadow-md shadow-black/50 hover:bg-white/10 transition-colors"
            aria-label="Promeni temu"
          >
            <span id="theme-icon" class="text-lg">☾</span>
          </button>
          <a
            href="/kontakt.html"
            class="rounded-full border border-gold/40 px-4 py-1.5 text-xs font-semibold uppercase tracking-[0.18em] text-gold hover:bg-gold hover:text-espresso transition-colors"
          >
            Kontakt
          </a>
        </div>
      </div>
    </header>

    <main class="pb-16 pt-10">
      <section class="mx-auto max-w-6xl px-4 md:px-6">
        <header class="mb-10 md:mb-12">
          <p
            class="text-xs font-semibold uppercase tracking-[0.28em] text-gold"
          >
            Meni
          </p>
          <h1
            class="mt-3 font-display text-3xl font-semibold tracking-tight text-espresso dark:text-cream md:text-4xl"
          >
            Naš kompletan izbor pića i deserata.
          </h1>
          <p
            class="mt-3 max-w-2xl text-sm text-espresso/80 dark:text-cream/80"
          >
            Sve cene su izražene u dinarima. Ponuda može povremeno da varira u
            zavisnosti od sezone i specijalnih ponuda.
          </p>
        </header>

        <div
          class="mb-6 flex flex-wrap items-center justify-between gap-4 text-xs"
        >
          <div class="flex flex-wrap items-center gap-3">
            <button
              class="filter-chip active"
              data-category="all"
            >
              Sve
            </button>
            <button class="filter-chip" data-category="Kafa">Kafa</button>
            <button class="filter-chip" data-category="Espresso pića">
              Espresso pića
            </button>
            <button class="filter-chip" data-category="Čajevi">
              Čajevi
            </button>
            <button class="filter-chip" data-category="Osvežavajuća pića">
              Osvežavajuća pića
            </button>
            <button class="filter-chip" data-category="Kokteli">
              Kokteli
            </button>
            <button class="filter-chip" data-category="Deserti">
              Deserti
            </button>
            <button class="filter-chip" data-category="Ukusi">
              Ukusi
            </button>
          </div>
          <p
            id="menu-count"
            class="text-[11px] uppercase tracking-[0.18em] text-espresso/60 dark:text-cream/60"
          >
            Učitavanje menija...
          </p>
        </div>

        <div
          id="menu-list"
          class="grid gap-4 md:grid-cols-2"
        ></div>
      </section>
    </main>

    <!-- meni.js prvi da meni uvek radi; main.js za temu, navigaciju itd. -->
    <script src="/meni.js?v=1"></script>
    <script src="/main.js?v=13"></script>

    <style>
      .filter-chip {
        border-radius: 9999px;
        padding: 0.4rem 0.9rem;
        border: 1px solid rgba(15, 10, 7, 0.16);
        background: rgba(255, 255, 255, 0.9);
        color: #2b211c;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: all 0.2s ease;
      }
      .filter-chip.active,
      .filter-chip:hover {
        background: linear-gradient(135deg, #c9a36a, #f5eee6);
        border-color: rgba(201, 163, 106, 0.9);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      }
      .dark .filter-chip {
        background: rgba(15, 10, 7, 0.9);
        border-color: rgba(249, 250, 251, 0.08);
        color: #f5eee6;
      }
      .dark .filter-chip.active,
      .dark .filter-chip:hover {
        background: linear-gradient(135deg, #c9a36a, #4b3425);
        border-color: rgba(201, 163, 106, 0.9);
      }
    </style>
  </body>
</html>
