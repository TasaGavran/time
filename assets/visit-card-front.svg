<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 55" width="85mm" height="55mm">
  <defs>
    <linearGradient id="bgFront" x1="0" y1="0" x2="85" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B211C"/>
      <stop offset="1" stop-color="#4B3425"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="85" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9A36A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5EEE6" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="qrClip" clipPathUnits="userSpaceOnUse">
      <rect x="52" y="19" width="18" height="18" rx="3.5"/>
    </clipPath>
  </defs>

  <rect width="85" height="55" rx="3" fill="url(#bgFront)"/>

  <!-- minimal frame -->
  <rect x="5" y="5" width="75" height="45" rx="2.5" fill="none" stroke="#C9A36A" stroke-opacity="0.25"/>

  <!-- (no extra top decorations) -->

  <!-- Top badge -->
  <text x="11" y="13" font-family="system-ui, sans-serif" font-size="3.1" fill="#C9A36A" letter-spacing="0.10em">
    Jagodina &#183; Srbija
  </text>

  <!-- Brand -->
  <text x="11" y="24" font-family="system-ui, sans-serif" font-size="7.2" fill="#F5EEE6" font-weight="900">
    Time
  </text>
  <text x="11" y="32" font-family="system-ui, sans-serif" font-size="7.2" fill="#C9A36A" font-weight="900">
    Caffe
  </text>
  <text x="11" y="41" font-family="system-ui, sans-serif" font-size="3.5" fill="#D9C3A3" font-style="italic">
    Vreme za kafu.
  </text>

  <!-- QR box (centered vertically, slightly right of text) -->
  <rect x="52" y="19" width="18" height="18" rx="3.5" fill="#ffffff" stroke="#C9A36A" stroke-opacity="0.75"/>
  <g clip-path="url(#qrClip)">
    <image
      x="52"
      y="19"
      width="18"
      height="18"
      preserveAspectRatio="none"
      shape-rendering="crispEdges"
      href="data:image/png;base64,"/>
  </g>
</svg>

