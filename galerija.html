<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover"
    />
    <link rel="icon" href="/assets/images/favicon-32.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <title>Galerija | Time Caffe</title>
    <meta
      name="description"
      content="Galerija Time Caffe-a u Jagodini – pogledajte fotografije enterijera, kafe, deserata i trenutaka sa gostima."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              espresso: "#2B211C",
              coffee: "#4B3425",
              latte: "#D9C3A3",
              cream: "#F5EEE6",
              gold: "#C9A36A",
            },
            fontFamily: {
              display: ["Poppins", "system-ui", "sans-serif"],
              body: ["DM Sans", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=26" />
  </head>
  <body
    class="bg-cream text-espresso font-body antialiased transition-colors duration-500 ease-out min-w-0 w-full"
  >
    <div
      id="page-transition"
      class="pointer-events-none fixed inset-0 z-40 bg-espresso opacity-0"
    ></div>
    <script>function hideOverlay(){var o=document.getElementById("page-transition");if(o)o.style.opacity="0";}hideOverlay();document.addEventListener("pageshow",hideOverlay);document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")hideOverlay();});document.addEventListener("DOMContentLoaded",hideOverlay);</script>

    <header
      class="sticky top-0 z-20 border-b border-espresso/10 bg-espresso/95 backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 md:px-6"
      >
        <a href="/" class="flex min-w-0 items-center gap-3">
          <img
            src="/assets/images/time-caffe-wordmark.png"
            alt="Time Caffe"
            width="392"
            height="605"
            decoding="async"
            class="h-8 w-auto max-w-[min(200px,60vw)] shrink-0 object-contain object-left invert sm:h-9"
          />
        </a>
        <button
          id="theme-toggle"
          class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-white/5 text-gold shadow-md shadow-black/50 hover:bg-white/10 transition-colors"
          aria-label="Promeni temu"
        >
          <span id="theme-icon" class="text-lg">☾</span>
        </button>
      </div>
    </header>

    <main class="pb-16 pt-10">
      <section class="mx-auto max-w-6xl px-4 md:px-6">
        <header class="mb-8 md:mb-10">
          <p
            class="text-xs font-semibold uppercase tracking-[0.28em] text-gold"
          >
            Galerija
          </p>
          <h1
            class="mt-3 font-display text-3xl font-semibold tracking-tight text-espresso dark:text-cream md:text-4xl"
          >
            Trenuci iz Time Caffe-a
          </h1>
          <p
            class="mt-3 max-w-2xl text-sm text-espresso/80 dark:text-cream/80"
          >
            Od prvog jutarnjeg espressa, preko popodnevnog cappuccina do
            večernjih druženja – ovde je mali deo atmosfere koju volimo da
            delimo sa vama.
          </p>
        </header>

        <div
          class="masonry-grid grid w-full max-w-6xl mx-auto grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 sm:gap-5"
        >
          <button class="gallery-item" type="button" data-src="/assets/images/galerija1.png">
            <img
              src="/assets/images/galerija1.png"
              alt="Topao napitak sa šlagom"
              width="768"
              height="1024"
              sizes="(max-width: 639px) 100vw, (max-width: 1023px) 50vw, 33vw"
              loading="lazy"
              decoding="async"
            />
          </button>
          <button class="gallery-item" type="button" data-src="/assets/images/galerija2.png">
            <img
              src="/assets/images/galerija2.png"
              alt="Milkshake varijacije ispod loga Time Caffe"
              width="768"
              height="1024"
              sizes="(max-width: 639px) 100vw, (max-width: 1023px) 50vw, 33vw"
              loading="lazy"
              decoding="async"
            />
          </button>
          <button class="gallery-item" type="button" data-src="/assets/images/galerija3.png">
            <img
              src="/assets/images/galerija3.png"
              alt="Kafa sa latte art u šoljicama Time Caffe"
              width="768"
              height="1024"
              sizes="(max-width: 639px) 100vw, (max-width: 1023px) 50vw, 33vw"
              loading="lazy"
              decoding="async"
            />
          </button>
          <button class="gallery-item" type="button" data-src="/assets/images/galerija4.png">
            <img
              src="/assets/images/galerija4.png"
              alt="Voćni kokteli u karafama"
              width="768"
              height="1024"
              sizes="(max-width: 639px) 100vw, (max-width: 1023px) 50vw, 33vw"
              loading="lazy"
              decoding="async"
            />
          </button>
          <button class="gallery-item" type="button" data-src="/assets/images/galerija5.png">
            <img
              src="/assets/images/galerija5.png"
              alt="Koktel „Nairobi“ – La Casa de Papel specijalitet"
              width="768"
              height="1024"
              sizes="(max-width: 639px) 100vw, (max-width: 1023px) 50vw, 33vw"
              loading="lazy"
              decoding="async"
            />
          </button>
          <button class="gallery-item" type="button" data-src="/assets/images/galerija6.jpg">
            <img
              src="/assets/images/galerija6.jpg"
              alt="Čokoladni napitak sa šlagom"
              width="768"
              height="1024"
              sizes="(max-width: 639px) 100vw, (max-width: 1023px) 50vw, 33vw"
              loading="lazy"
              decoding="async"
            />
          </button>
        </div>
      </section>

      <div
        id="lightbox"
        class="fixed inset-0 z-40 hidden items-center justify-center bg-black/80 backdrop-blur"
      >
        <button
          id="lightbox-close"
          class="absolute right-6 top-6 rounded-full bg-white/10 p-2 text-white hover:bg-white/20"
          aria-label="Zatvori"
        >
          ✕
        </button>
        <img
          id="lightbox-image"
          src=""
          alt="Pregled fotografije"
          class="max-h-[80vh] max-w-[90vw] rounded-3xl shadow-2xl shadow-black/70"
        />
      </div>
    </main>

    <script src="/main.js?v=16"></script>
  </body>
</html>
